{% extends 'appointments/base.html' %}
{% block title %}{% if schedule %}Edit{% else %}Add{% endif %} Schedule{% endblock %}
{% block content %}
<div class="container py-5 auth-wrap">
    <div class="auth-card">
        <h1 class="h3 text-primary">{% if schedule %}Edit{% else %}Add{% endif %} Schedule</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'appointments/form_fields.html' %}
            <button class="btn btn-primary w-100" type="submit">Save Schedule</button>
        </form>
    </div>
</div>
{% endblock %}
